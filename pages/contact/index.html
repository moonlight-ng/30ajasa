<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Makerspace</title>
    <meta name="description"
        content="Contact Makerspace by email or visit us at 30 Ajasa Street, Onikan, Lagos Island.">
    <link rel="canonical" href="https://30ajasa.com/contact/">
    <link rel="icon" href="/images/shared/logos/16-16.webp" type="image/webp">
    <meta property="og:site_name" content="Makerspace">
    <meta property="og:locale" content="en_NG">
    <meta property="og:title" content="Contact — Makerspace">
    <meta property="og:description"
        content="Email Makerspace or visit us at 30 Ajasa Street, Onikan, Lagos Island.">
    <meta property="og:url" content="https://30ajasa.com/contact/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://30ajasa.com/images/hero/2026.png">
    <meta property="og:image:alt" content="Makerspace at 30 Ajasa Street">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact — Makerspace">
    <meta name="twitter:description"
        content="Email Makerspace or visit us at 30 Ajasa Street, Onikan, Lagos Island.">
    <meta name="twitter:image" content="https://30ajasa.com/images/hero/2026.png">
    <link rel="stylesheet" href="../../app/styles/style.css">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ContactPage",
        "name": "Contact Makerspace",
        "url": "https://30ajasa.com/contact/",
        "description": "Contact Makerspace at 30 Ajasa Street, Lagos Island.",
        "mainEntity": {
            "@type": "Organization",
            "@id": "https://30ajasa.com/#organization",
            "name": "Makerspace",
            "email": "makerspace@16by16.co",
            "url": "https://30ajasa.com/"
        }
    }
    </script>
</head>

<body>
    <noscript>
        <style>
            body {
                opacity: 1
            }
        </style>
    </noscript>

    <!-- Peripheral Navigation -->
    <div id="navigation-placeholder"></div>

    <main class="page-content">
        <section class="contact-simple" aria-labelledby="contact-heading">
            <header class="contact-simple-heading">
                <p class="contact-eyebrow">Makerspace</p>
                <h1 id="contact-heading">Contact</h1>
            </header>
            <address class="contact-details">
                <div>
                    <p class="contact-label">Email</p>
                    <a href="mailto:makerspace@16by16.co">makerspace@16by16.co</a>
                </div>
                <div>
                    <p class="contact-label">Visit</p>
                    <p>30 Ajasa Street<br>Onikan, Lagos Island<br>Nigeria</p>
                </div>
            </address>
        </section>

        <section class="contact-rent" aria-labelledby="contact-rent-heading">
            <p class="contact-label">Space rental</p>
            <div>
                <h2 id="contact-rent-heading">Make the space yours for a while.</h2>
                <p>Planning a workshop, class, shoot, meeting or gathering? Rent the space for four hours at ₦100,000.</p>
                <a class="contact-rent-link" href="/rent/">Rent the space</a>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../../app/scripts/navigation.js"></script>
    <script>
        // Load navigation component
        fetch('../../app/components/navigation.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navigation-placeholder').innerHTML = html;
                // Re-initialize navigation after component loads
                if (window.initNavigation) {
                    window.initNavigation();
                }
            });
    </script>
    <script src="../../app/scripts/footer.js"></script>
    <script src="../../app/scripts/page-transitions.js"></script>
</body>

</html>
